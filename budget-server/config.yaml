name: "Budget Tracker"
description: "Serves the Budget Tracker single-page app and its JSON budget document, behind Home Assistant Ingress. No configuration required."
slug: "budget_server"
version: "1.3.3"
arch:
  - aarch64
  - amd64
  - armv7
init: false
# Start with Home Assistant — a budget you have to remember to turn on
# is a budget you stop using.
boot: auto
panel_title: "Budget"
ingress: true
ingress_port: 8099
ingress_require_admin: false
panel_icon: mdi:wallet-outline
panel_admin: false
