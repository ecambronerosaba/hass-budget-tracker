<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141517" />
    <script>
      // Applied synchronously, before first paint, so a light-mode or
      // light-system browser doesn't flash dark first. Kept in sync by
      // hand with src/lib/theme.ts's parseThemePref/resolveTheme — this
      // can't import that module because it must run before the bundle.
      (function () {
        try {
          var pref = localStorage.getItem('budget-tracker:theme');
          var prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            pref === 'dark' || pref === 'light' ? pref : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          // localStorage/matchMedia unavailable: the dark default on <html> stands.
        }
      })();
    </script>
